
name: Aggiorna playlist IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Aggiorna indirizzi Dailymotion
        run: python refresh.py

      - name: Salva modifiche
        run: |
          git config user.name "IPTV Refresher"
          git config user.email "actions@github.com"
          git add "IPTVMIA 1.m3u"
          git diff --cached --quiet || (git commit -m "Aggiornamento playlist" && git push)
